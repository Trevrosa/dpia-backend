<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>DPIA Sensor Dashboard</title>
        <link rel="stylesheet" href="./styles.css" />
    </head>
    <body>
        <main class="container">
            <!-- Header with filters -->
            <header class="page-header">
                <div>
                    <!--<p class="eyebrow">DPIA</p>-->
                    <h1>Sensor Dashboard</h1>
                </div>
                <div class="header-controls">
                    <form id="filterForm" class="filter-inline">
                        <label>
                            Start
                            <input id="startInput" name="start" type="datetime-local" step="1" />
                        </label>
                        <label>
                            End
                            <input id="endInput" name="end" type="datetime-local" step="1" />
                        </label>
                        <button class="primary-btn" type="submit">Apply</button>
                        <button id="clearFiltersBtn" class="secondary-btn" type="button">
                            Clear
                        </button>
                    </form>
                    <button id="refreshBtn" class="primary-btn" type="button">Refresh</button>
                    <span id="updateStatus" class="update-status">Last update: --</span>
                </div>
            </header>

            <!-- Dashboard gauges -->
            <section class="metrics-dashboard">
                <h2>Live Readings</h2>
                <div class="gauge-grid" id="gaugeGrid"></div>
            </section>

            <!-- Charts grid -->
            <section class="charts-grid">
                <article class="card chart-card">
                    <h2>Air Temperature (°C)</h2>
                    <canvas id="chart-air_temp"></canvas>
                </article>
                <article class="card chart-card">
                    <h2>Ground Temperature (°C)</h2>
                    <canvas id="chart-ground_temp"></canvas>
                </article>
                <article class="card chart-card">
                    <h2>Humidity (%)</h2>
                    <canvas id="chart-humidity"></canvas>
                </article>
                <article class="card chart-card">
                    <h2>Air Quality</h2>
                    <canvas id="chart-air_quality"></canvas>
                </article>
            </section>
        </main>

        <script type="module" src="./app.ts"></script>
    </body>
</html>
